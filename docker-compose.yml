version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cashly_pos_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Pos.Api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-cashly_pos_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      JWT_KEY: ${JWT_KEY:?set JWT_KEY in .env — a long random string}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SuperAdmin__Username: ${SUPER_ADMIN_USERNAME:-superadmin}
      SuperAdmin__Pin: ${SUPER_ADMIN_PIN:?set SUPER_ADMIN_PIN in .env}
    ports:
      - "5288:5288"

  frontend:
    build:
      context: ./pos-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5288}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
